
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chamada705 | Entrar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #090b0d;
            --surface: #ffffff;
            --text: #18202a;
            --muted: #697386;
            --primary: #183440;
            --accent: #356cff;
            --border: #dce3eb;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        button, input {
            font: inherit;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-size: 12px;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 1100px;
            min-height: 650px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 20px;
            background: var(--surface);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgb(0 0 0 / 35%);
        }

        .login-content {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 35px clamp(20px, 4vw, 65px);
        }

        .login-form {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 27px;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
            color: #15232c;
        }

        .login-header p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 700;
            color: #273746;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #f8fafc;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(53 108 255 / 12%);
        }

        .form-group input::placeholder {
            color: #9aa6b7;
        }

        .forgot-password {
            text-align: right;
            margin-top: -5px;
            margin-bottom: 22px;
        }

        .login-button {
            width: 100%;
            min-height: 46px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-button:hover {
            background: #254b5b;
            transform: translateY(-1px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 27px 0 20px;
            color: var(--muted);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .social-button {
            width: 100%;
            min-height: 43px;
            margin-bottom: 10px;
            border: 1px solid #e6ebf1;
            border-radius: 9px;
            background: #f7f9fb;
            color: #475569;
            font-size: 12px;
        }

        .social-button:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .signup-text {
            margin-top: 25px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.8;
        }

        .login-footer {
            margin-top: 38px;
            text-align: center;
            color: #9aa3b2;
            font-size: 10px;
            line-height: 1.7;
        }

        /* IMAGEM DE FUNDO */
        .login-image {
            position: relative;
            display: flex;
            align-items: flex-end;
            min-height: 610px;
            overflow: hidden;
            border-radius: 16px;
            background-color: #22251e;

            background-image:
                linear-gradient(
                    to top,
                    rgb(0 0 0 / 80%),
                    transparent 70%
                ),
                url("/images/regente-705.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .image-overlay {
            padding: 35px;
            color: white;
        }

        .image-overlay span {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 5px;
        }

        .image-overlay p {
            margin-top: 12px;
            color: #e8e8e8;
            font-size: 14px;
            line-height: 1.7;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid rgb(53 108 255 / 45%);
            outline-offset: 3px;
        }

        @media (max-width: 760px) {
            .login-container {
                padding: 18px 12px;
            }

            .login-card {
                max-width: 460px;
                min-height: auto;
                grid-template-columns: 1fr;
                gap: 0;
                padding: 12px;
                border-radius: 20px;
            }

            .login-image {
                grid-row: 1;
                min-height: 200px;
                margin-bottom: 12px;
                background-position: center 45%;
            }

            .image-overlay {
                padding: 22px;
            }

            .login-content {
                padding: 30px 20px 22px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-footer {
                margin-top: 28px;
            }
        }

        @media (max-width: 360px) {
            .login-content {
                padding-right: 12px;
                padding-left: 12px;
            }

            .login-header h1 {
                font-size: 22px;
            }
        }
    </style>

    <script th:src="@{/js/login.js}" defer></script>
</head>

<body>
    <main class="login-container">
        <section class="login-card">

            <div class="login-content">
                <div class="login-form">

                    <header class="login-header">
                        <h1>Bem-vindo de volta</h1>
                        <p>
                            Um novo dia, novas possibilidades.
                            Entre para gerenciar seus chamados de TI.
                        </p>
                    </header>

                    <form id="loginForm" method="post">

                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="exemplo@email.com"
                                autocomplete="username"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="senha">Senha</label>
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required>
                        </div>

                        <div class="forgot-password">
                            <a th:href="@{/recuperar-senha}">
                                Esqueceu a senha?
                            </a>
                        </div>

                        <button type="submit" class="login-button">
                            Entrar
                        </button>

                        <div class="divider">
                            <span>ou</span>
                        </div>

                        <button
                            type="button"
                            class="social-button"
                            disabled>
                            Continuar com Google
                        </button>

                        <button
                            type="button"
                            class="social-button"
                            disabled>
                            Continuar com Facebook
                        </button>

                        <p class="signup-text">
                            Ainda não tem uma conta?
                            <a th:href="@{/cadastro}">Cadastre-se</a>
                        </p>

                    </form>
                </div>

                <footer class="login-footer">
                    &copy; 2026 Chamada705. Todos os direitos reservados.
                </footer>
            </div>

            <div class="login-image">
                <div class="image-overlay">
                    <span>CHAMADA705</span>
                    <p>Tecnologia que conecta soluções.</p>
                </div>
            </div>

        </section>
    </main>
</body>
</html>
